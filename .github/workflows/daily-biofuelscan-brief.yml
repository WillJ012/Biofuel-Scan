name: daily-biofuelscan-brief

# 触发方式：
#   1) workflow_dispatch —— 手动点 Run，或由 cron-job.org 用 GitHub API 每天 08:30(北京) 定时 POST 触发（推荐，稳定）
#   2) schedule —— GitHub 自带定时(00:30 UTC = 08:30 北京)。仅作兜底，常有数分钟~数小时延迟甚至不触发，别依赖它。
on:
  workflow_dispatch:


# 避免重叠运行
concurrency:
  group: biofuelscan-brief
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run BiofuelScan brief
        env:
          # 收件 IMAP
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_PORT: ${{ secrets.IMAP_PORT }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASS: ${{ secrets.IMAP_PASS }}
          MAILBOX:   ${{ secrets.MAILBOX }}
          # 发件 SMTP
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_SSL:  ${{ secrets.SMTP_SSL }}
          MAIL_TO:   ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          # 邮件识别
          SUBJECT_CONTAINS: ${{ secrets.SUBJECT_CONTAINS }}
          SENDER_CONTAINS:  ${{ secrets.SENDER_CONTAINS }}
          ATTACH_PATTERN:   ${{ secrets.ATTACH_PATTERN }}
          LOOKBACK_DAYS:    ${{ secrets.LOOKBACK_DAYS }}
          # 大模型（OpenAI 兼容）
          LLM_API_KEY:    ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL:   ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL:      ${{ secrets.LLM_MODEL }}
          LLM_MAX_TOKENS: ${{ secrets.LLM_MAX_TOKENS }}
          # 过渡期兼容：LLM_API_KEY 为空时，脚本回退用到下面这三个旧名字。
          # 确认 LLM_API_KEY 生效、云端跑通后，这三行和脚本里的回退可以一起删掉。
          MINIMAX_API_KEY:  ${{ secrets.MINIMAX_API_KEY }}
          MINIMAX_BASE_URL: ${{ secrets.MINIMAX_BASE_URL }}
          MODEL:            ${{ secrets.MODEL }}
        run: python biofuelscan_brief.py
